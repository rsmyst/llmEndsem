[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matp"
version = "1.0.0"
description = "MATP: Memory-Augmented Tool Policy — Unified Monorepo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
bench = ["matplotlib>=3.8", "numpy>=1.26", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["matp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
